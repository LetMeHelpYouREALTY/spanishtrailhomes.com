# Deploy production using a GitHub-hosted checkout + Vercel CLI prebuilt output.
# Use when Vercel's "clone repo" step fails (e.g. git provider HTTP 500): this path does not
# rely on Vercel cloning GitHub on Vercel's builders.
#
# Required GitHub repository secrets (Vercel → Account Settings → Tokens; Project / Team Settings for IDs):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
#
# If both this workflow and Vercel Git auto-deploy run on every push, you may get two production
# deployments per commit. To use only this path: Vercel → Project → Settings → Git → adjust
# Production Branch behavior, or disconnect automatic production deploys.

name: Vercel Production (prebuilt)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: vercel-production-prebuilt-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment (production)
        run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build (production)
        run: npx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy (prebuilt, production)
        run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
